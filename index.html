<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><title>Cintillo OBS</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root{color-scheme:dark;--name-size:38px;--title-size:22px}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:transparent;color:#fff}#artwork{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;opacity:0;transition:opacity .25s ease}#artwork.loaded.visible{opacity:1}#text-overlay{position:fixed;left:var(--text-x,20%);top:var(--text-y,82%);width:max-content;max-width:76vw;display:flex;flex-direction:column;gap:5px;opacity:0;pointer-events:none;transition:opacity .25s ease}#text-overlay.visible{opacity:1}.person{display:flex;flex-direction:column;gap:2px;max-width:100%}.person-name{display:block;max-width:100%;white-space:nowrap;color:#fff;font-size:var(--name-size);line-height:1.08;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-shadow:0 2px 6px #000f,0 0 14px #000d}.person-title{display:block;max-width:100%;white-space:normal;overflow-wrap:break-word;color:#fff;font-size:var(--title-size);line-height:1.2;font-weight:600;letter-spacing:.3px;text-shadow:0 2px 6px #000f,0 0 14px #000d}@media(max-width:1000px){#text-overlay{max-width:82vw}}@media(max-width:600px){#text-overlay{max-width:88vw}}@media(prefers-reduced-motion:reduce){#artwork,#text-overlay{transition:opacity .01ms}}
  </style>
</head>
<body>
  <img id="artwork" alt="" aria-hidden="true"><div id="text-overlay" aria-live="polite"></div>
  <script>
    const textOverlay=document.getElementById('text-overlay'),artwork=document.getElementById('artwork');
    const DEFAULT_ARTWORK='https://raw.githubusercontent.com/belkinnauta/obs-cintillo/main/cintillos/SUPER%20POMUCH%2026.png',API_URL='https://api.npoint.io/2b81ca901938404ea4e7',POLL_INTERVAL_MS=2000;let isFetching=false;
    function setArtwork(source){const next=typeof source==='string'&&source.trim()?source.trim():DEFAULT_ARTWORK;if(artwork.src===next)return;artwork.classList.remove('loaded');artwork.onload=()=>artwork.classList.add('loaded');artwork.onerror=()=>{artwork.classList.remove('loaded');console.error('No se pudo cargar el diseño PNG:',next)};artwork.src=next}
    function fitName(){const name=textOverlay.querySelector('.person-name');if(!name)return;const available=Math.min(window.innerWidth*.76,window.innerWidth-textOverlay.offsetLeft-8);if(available<=0)return;let size=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--name-size'))||38;name.style.fontSize=size+'px';while(name.scrollWidth>available&&size>12){size--;name.style.fontSize=size+'px'}}
    function renderPerson(person){const row=document.createElement('div');row.className='person';const name=document.createElement('span');name.className='person-name';name.textContent=typeof person.nombre==='string'?person.nombre.trim():'';const title=document.createElement('span');title.className='person-title';title.textContent=typeof person.cargo==='string'?person.cargo.trim():'';row.append(name,title);textOverlay.replaceChildren(row)}
    function applyState(data){const x=Number.isFinite(Number(data.posX))?Math.min(95,Math.max(0,Number(data.posX))):20,y=Number.isFinite(Number(data.posY))?Math.min(95,Math.max(0,Number(data.posY))):82,nameSize=Number.isFinite(Number(data.fontSizeNombre))?Math.min(80,Math.max(12,Number(data.fontSizeNombre))):38,titleSize=Number.isFinite(Number(data.fontSizeCargo))?Math.min(60,Math.max(10,Number(data.fontSizeCargo))):22;document.documentElement.style.setProperty('--text-x',x+'%');document.documentElement.style.setProperty('--text-y',y+'%');document.documentElement.style.setProperty('--name-size',nameSize+'px');document.documentElement.style.setProperty('--title-size',titleSize+'px');setArtwork(data.bgImage);
      let person;if(Array.isArray(data.personas)){person=data.personas.find(p=>p.id===data.onAirPersonaId)||data.personas.find(p=>p.id===data.selectedPersonaId)||data.personas.find(p=>p.tipo==='conductor')||data.personas[0]}else{person={nombre:data.titulo,cargo:data.subtitulo}}
      const hasText=!!(person&&(String(person.nombre||'').trim()||String(person.cargo||'').trim()));if(hasText)renderPerson(person);else textOverlay.replaceChildren();const visible=data.activo===true&&hasText;artwork.classList.toggle('visible',visible);textOverlay.classList.toggle('visible',visible);fitName()}
    window.addEventListener('resize',fitName);setArtwork(DEFAULT_ARTWORK);
    async function verificarEstadoNube(){if(isFetching)return;isFetching=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);try{const response=await fetch(API_URL+'?t='+Date.now(),{cache:'no-store',headers:{Accept:'application/json'},signal:controller.signal});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('Respuesta inválida');applyState(data)}catch(error){console.error('Error leyendo la nube:',error)}finally{clearTimeout(timeout);isFetching=false;setTimeout(verificarEstadoNube,POLL_INTERVAL_MS)}}
    verificarEstadoNube();
  </script>
</body>
</html>
